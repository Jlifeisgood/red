<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажёр НСБУ № 21</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: an account-book workbook. A masthead closed by the red double rule of a ledger, then one ruled
   "sheet" with a red margin where every exercise happens. Home is the table of contents: one clear next step,
   four modes, a short primer. Phones get a bottom tab bar and a docked "Next" button; settings live in one sheet.
   Debit = teal ink, credit = plum ink; active accounts wear the debit colour, passive the credit colour. */
:root{
  --paper:#EEF2ED; --sheet:#FAFCF8; --sheet-2:#F3F6F1; --ink:#1B2922; --muted:#57675E; --faint:#85948B;
  --rule:#CFDBD2; --line:#E4ECE5; --margin:#C8443B;
  --accent:#23406B; --accent-2:#E2E9F3; --on-accent:#FFFFFF;
  --dt:#0E6C77; --dt-bg:#DDEFF0; --kt:#7A3E8C; --kt-bg:#F0E4F3;
  --tr:#94600F; --tr-bg:#F5EBD6; --bt:#56625D; --bt-bg:#E6EBE8;
  --ok:#2A8648; --ok-bg:#E1F1E6; --on-ok:#FFFFFF; --bad:#BE3A2F; --bad-bg:#F8E3E0; --on-bad:#FFFFFF;
  --shadow:0 1px 0 rgba(27,41,34,.04), 0 10px 26px -14px rgba(27,41,34,.22);
  --scrim:rgba(14,22,18,.42);
  --r:10px; --bnav-h:0px;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1411; --sheet:#141C18; --sheet-2:#18221D; --ink:#E1EBE4; --muted:#9AACA1; --faint:#6F8076;
    --rule:#2B3932; --line:#1E2924; --margin:#E06A60;
    --accent:#9DBDEB; --accent-2:#1D2A3B; --on-accent:#0E1411;
    --dt:#5CC6D0; --dt-bg:#11292C; --kt:#CD95DF; --kt-bg:#2A1B31;
    --tr:#E2B15F; --tr-bg:#2D2515; --bt:#A6B1AB; --bt-bg:#212925;
    --ok:#63C886; --ok-bg:#14301F; --on-ok:#0E1411; --bad:#F27E73; --bad-bg:#3A1D1A; --on-bad:#0E1411;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 30px -16px rgba(0,0,0,.7);
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1411; --sheet:#141C18; --sheet-2:#18221D; --ink:#E1EBE4; --muted:#9AACA1; --faint:#6F8076;
  --rule:#2B3932; --line:#1E2924; --margin:#E06A60;
  --accent:#9DBDEB; --accent-2:#1D2A3B; --on-accent:#0E1411;
  --dt:#5CC6D0; --dt-bg:#11292C; --kt:#CD95DF; --kt-bg:#2A1B31;
  --tr:#E2B15F; --tr-bg:#2D2515; --bt:#A6B1AB; --bt-bg:#212925;
  --ok:#63C886; --ok-bg:#14301F; --on-ok:#0E1411; --bad:#F27E73; --bad-bg:#3A1D1A; --on-bad:#0E1411;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 30px -16px rgba(0,0,0,.7);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:15px;height:15px;stroke-width:2.2}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}

/* masthead */
.mast-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.mast-row > div:first-child{min-width:0}
h1{font:700 clamp(20px,3.4vw,30px)/1.12 var(--f-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
h1 a{color:inherit;text-decoration:none}
.sub{margin:6px 0 0;color:var(--muted);font-size:13px}
.langbox{flex:none;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:2px;background:var(--sheet)}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);min-width:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.rule2{height:5px;border-top:1.5px solid var(--margin);border-bottom:1.5px solid var(--margin);margin:14px 0 0}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:10px;padding:2px 0}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;font-size:14px;white-space:nowrap}
.tabs a svg.i{width:17px;height:17px}
@media (hover:hover){.tabs a:hover{color:var(--ink);background:var(--sheet-2)}}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.bnav{display:none}

/* toolbar above an exercise: one button that says what is being trained and opens the settings */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.pillbtn{display:inline-flex;align-items:center;gap:8px;max-width:100%;min-height:40px;border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:7px 15px 7px 12px;font-size:14px;font-weight:600;color:var(--ink)}
.pillbtn svg.i{width:18px;height:18px;color:var(--accent)}
.pillbtn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (hover:hover){.pillbtn:hover{border-color:var(--accent)}}

/* chips (reference filter) */
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 0}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--muted);white-space:nowrap}
@media (hover:hover){.chip:hover{border-color:var(--accent);color:var(--ink)}}
.chip[aria-pressed="true"]{border-color:transparent;background:var(--accent);color:var(--on-accent);font-weight:600}
@media (max-width:720px){
  .bar.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-16px;padding-inline:16px}
  .bar.scroll::-webkit-scrollbar{display:none}
  .bar.scroll .chip{flex:none}
}

/* the ruled sheet */
.sheet{position:relative;margin-top:14px;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:44px;width:5px;border-left:1.5px solid var(--margin);border-right:1.5px solid var(--margin);opacity:.5;pointer-events:none}
.sheet-in{position:relative;padding:20px 24px 24px 70px;background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--line) 31px 32px);min-height:200px}
@media (max-width:560px){.sheet::before{left:14px}.sheet-in{padding:16px 14px 20px 32px}}
.qmeta{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.qmeta .num{font-variant-numeric:tabular-nums;letter-spacing:.04em}
.tally{display:inline-flex;gap:10px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.tally span{display:inline-flex;align-items:center;gap:3px}
.tally .ok{color:var(--ok)} .tally .bad{color:var(--bad)}
.pbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.prompt{margin:16px 0 18px}
.prompt .ask{font-weight:600;color:var(--muted);font-size:15px;margin-bottom:8px}
.prompt .big{font:700 clamp(44px,9vw,68px)/1 var(--f-mono);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.prompt .txt{font:600 clamp(19px,2.7vw,25px)/1.3 var(--f-body);text-wrap:balance;overflow-wrap:anywhere}
.prompt .big + .txt{margin-top:10px}
.prompt .hint{color:var(--muted);font-size:13px;margin-top:8px}

/* options */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.six{grid-template-columns:repeat(3,1fr)}
@media (max-width:640px){.opts,.opts.six{grid-template-columns:1fr}}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;min-height:54px;padding:12px 13px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);transition:border-color .12s,background-color .12s}
@media (hover:hover){.opt:hover:not([disabled]){border-color:var(--accent)}}
.opt .ix{flex:none;width:22px;height:22px;margin-top:1px;border-radius:6px;border:1px solid var(--rule);display:grid;place-items:center;font:600 12px var(--f-mono);color:var(--faint)}
@media (hover:none){.opt .ix{display:none}}
.opt .v{min-width:0;overflow-wrap:anywhere}
.opt .code{font:700 21px/1.1 var(--f-mono);letter-spacing:.03em}
.opt .topt{display:flex;gap:10px;align-items:flex-start}
.opt .tname{display:block;font-weight:600}
.opt .tsub{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.dim{opacity:.5}
.opt[disabled]{cursor:default;color:inherit}

/* debit/credit pair */
.pair{display:grid;gap:5px;min-width:0}
.side{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;min-width:0}
.side b{flex:none;min-width:54px;text-align:center;font:700 11px/1.75 var(--f-body);letter-spacing:.02em;padding:0 6px;border-radius:5px}
.side.d b{background:var(--dt-bg);color:var(--dt)}
.side.k b{background:var(--kt-bg);color:var(--kt)}
/* long code lists (0710–0890, 1010–1120, 2810–2990) wrap and push the name to its own line instead of squeezing it */
.side .cc{flex:0 1 auto;min-width:0;font:700 15px var(--f-mono);font-variant-numeric:tabular-nums}
.side .nn{flex:1 1 96px;min-width:0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}

/* feedback */
.fb{margin-top:16px;padding:14px 16px;border-radius:var(--r);border:1px solid var(--rule);background:var(--sheet-2);scroll-margin-bottom:170px}
.fb.ok{border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:var(--ok-bg)}
.fb.bad{border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:var(--bad-bg)}
.fb h3{margin:0 0 10px;font:700 15px var(--f-body);display:flex;align-items:center;gap:6px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.acard{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;align-items:baseline}
.acard .c{font:700 22px var(--f-mono);grid-row:span 2}
.acard .n{font-weight:600;overflow-wrap:anywhere}
.acard .n2{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.acard .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px;color:var(--muted);margin-top:4px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:28px;padding:0 6px;border-radius:6px;font:700 12px/1.75 var(--f-mono);border:1px solid transparent;white-space:nowrap}
.t-a{background:var(--dt-bg);color:var(--dt)}
.t-p{background:var(--kt-bg);color:var(--kt)}
.t-ka{border-color:var(--dt);color:var(--dt)}
.t-kp{border-color:var(--kt);color:var(--kt)}
.t-t{background:var(--tr-bg);color:var(--tr)}
.t-bt{background:var(--bt-bg);color:var(--bt)}

/* "why this entry" */
.why{margin-top:14px;padding-top:12px;border-top:1px dashed color-mix(in srgb,var(--ink) 20%,transparent);scroll-margin-top:12px;scroll-margin-bottom:170px}
.why h4{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.why-row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;margin-top:10px}
.why-side{min-width:54px;padding:0 6px;border-radius:5px;text-align:center;font:700 11px/1.75 var(--f-body);letter-spacing:.02em}
.why-row.d .why-side{background:var(--dt-bg);color:var(--dt)}
.why-row.k .why-side{background:var(--kt-bg);color:var(--kt)}
.why-body{min-width:0}
.why-acc{font-weight:600;overflow-wrap:anywhere}
.why-acc .cc{font:700 14px var(--f-mono);margin-right:6px}
.why-body p{margin:3px 0 0;font-size:14px;line-height:1.45}
.why-body ul{margin:4px 0 0;padding-left:18px;font-size:14px;line-height:1.45}
.why-sum{margin:12px 0 0;padding:10px 12px;border-radius:8px;background:var(--sheet);font-size:14px;line-height:1.45}

/* plain-language breakdown */
.why h5{margin:16px 0 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.why-plain{margin:8px 0 0;font-size:15px;line-height:1.5;font-weight:500}
.xs{margin-top:8px;padding:10px 12px 11px;border-radius:10px;background:var(--sheet);border:1px solid var(--line);border-left:4px solid var(--dt)}
.xs.k{border-left-color:var(--kt)}
.xs-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-weight:600;overflow-wrap:anywhere}
.xs-h .cc{font:700 14px var(--f-mono)}
.xs.d .why-side{background:var(--dt-bg);color:var(--dt)}
.xs.k .why-side{background:var(--kt-bg);color:var(--kt)}
.xs p{margin:8px 0 0;font-size:14px;line-height:1.5}
.xs ul{margin:6px 0 0;padding-left:18px;font-size:14px;line-height:1.5}
.xs .lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.xs .badge{vertical-align:1px}
.xs.d .res{color:var(--dt)} .xs.k .res{color:var(--kt)}
.arr{display:inline-grid;place-items:center;width:20px;height:20px;margin-right:6px;border-radius:6px;font:700 13px/1 var(--f-body);vertical-align:1px}
.arr.up{background:var(--ok-bg);color:var(--ok)} .arr.dn{background:var(--bad-bg);color:var(--bad)} .arr.mv{background:var(--tr-bg);color:var(--tr)}
.eq{margin-top:10px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);overflow:hidden}
.eq-r{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.eq-r:first-child{border-top:0}
.eq-r .op{font:700 16px var(--f-mono);color:var(--faint);text-align:center}
.eq-r .lb{min-width:0;font-weight:600;font-size:14px}
.eq-r .lb small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.eq-r .v{display:grid;gap:2px;justify-items:end}
.chg{font:700 14px var(--f-mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.chg i{display:block;font:500 11px var(--f-mono);color:var(--faint);font-style:normal;text-align:right}
.chg.zero{color:var(--faint)}
@media (max-width:560px){.eq-r{grid-template-columns:16px minmax(0,1fr)}.eq-r .v{grid-column:2;justify-items:start}.eq-r .chg{display:flex;gap:8px;align-items:baseline}.eq-r .chg i{text-align:left}}
.eq-note{margin:6px 0 0;font-size:13px;color:var(--muted);line-height:1.45}
.tip,.conf{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:14px;line-height:1.5}
.tip{background:var(--accent-2)}
.conf{background:var(--tr-bg)}
.ex{margin-top:12px;padding:12px;border-radius:10px;border:1px dashed color-mix(in srgb,var(--ink) 25%,transparent);background:var(--sheet);font-size:14px;line-height:1.5}
.ex-h{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.ex-h svg.i{color:var(--margin)}
.ex-h b{color:var(--ink)}
.ex p{margin:6px 0 0}
.ex .sum{font:700 13px var(--f-mono);white-space:nowrap}
.ex-w{color:var(--muted)}
.linkbtn{display:inline-flex;align-items:center;gap:5px}
.linkbtn.tl{display:inline;text-align:left;padding:0;font-weight:500;font-size:14px;line-height:1.4}

/* T-accounts */
.taccs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media (max-width:560px){.taccs{grid-template-columns:1fr}}
.tacc{border:1px solid var(--rule);border-radius:8px;background:var(--sheet);overflow:hidden;min-width:0}
.tacc .th{padding:8px 10px;border-bottom:2px solid var(--ink);font-size:13px;overflow-wrap:anywhere}
.tacc .th .cc{font:700 14px var(--f-mono);margin-right:6px}
.tacc .tb{display:grid;grid-template-columns:1fr 1fr}
.tacc .tb > span{padding:6px 10px 10px;font:600 11px var(--f-body);color:var(--faint)}
.tacc .tb > span:first-child{border-right:2px solid var(--ink)}
.tacc .tb .hit::after{content:"";display:block;margin-top:6px;height:6px;border-radius:3px;background:currentColor;width:72%}
.tacc.d .tb .hit{color:var(--dt)} .tacc.k .tb .hit{color:var(--kt)}
.tacc .tb.amt .hit::after{display:none}
.tacc .tb .hit b{display:block;margin-top:4px;font:700 15px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tacc .tf{padding:6px 10px 7px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.tacc .tf b{color:var(--ink);font:700 12px var(--f-mono)}

/* inputs */
.field{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp{font:700 26px var(--f-mono);letter-spacing:.14em;width:6.4ch;padding:8px 12px;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink);font-variant-numeric:tabular-nums}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-2)}
.inp.wide{width:100%;font-size:20px;letter-spacing:.06em}
.inp::placeholder{font:400 15px var(--f-body);letter-spacing:0;color:var(--faint)}
.inp.okb{border-color:var(--ok)} .inp.badb{border-color:var(--bad)}
.hintbox{padding:8px 12px;border-radius:8px;background:var(--accent-2);color:var(--ink)}
.ent-in{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.ent-in{grid-template-columns:1fr}}
.ent-in label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.ent-in .d label{color:var(--dt)} .ent-in .k label{color:var(--kt)}
.sugg{position:relative}
.sugg ul{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);max-height:250px;overflow:auto}
.sugg li button{display:grid;grid-template-columns:46px 1fr;gap:8px;width:100%;text-align:left;border:0;background:none;padding:8px;border-radius:6px;font-size:13px}
.sugg li button .cc{font:700 13px var(--f-mono)}
.sugg li button.act{background:var(--accent-2)}
@media (hover:hover){.sugg li button:hover{background:var(--accent-2)}}
.sel-name{min-height:18px;margin-top:4px;font-size:12px;color:var(--muted)}

/* buttons */
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:8px 18px;font-weight:600;font-size:15px;color:var(--ink);text-align:center}
@media (hover:hover){.btn:hover{border-color:var(--accent)}}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* settings sheet */

/* practical examples */

.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}

.case-t{display:flex;align-items:center;gap:10px;margin:8px 0 0;font:700 clamp(19px,2.6vw,24px)/1.25 var(--f-display);text-wrap:balance}

  shuffle(pool.filter(x => fam && (x.grp === fam || x.code === fam))).forEach(add);

  shuffle(near).forEach(add);
  shuffle(ACC.filter(x => x.sec === a.sec && x.isGroup === a.isGroup)).forEach(add);

const RefView = {
  q: '', open: null, all: {}, chap: -1,
  enter() { this.render(); },
  render() {
    const m = $('#main'); m.replaceChildren();
    const inp = h('input', { id: 'ref-q', class: 'search', type: 'search', enterkeyhint: 'search', placeholder: 'Код или слово, например «касса»', 'aria-label': 'Поиск по плану счетов', value: this.q });
    inp.addEventListener('input', () => { this.q = inp.value; this.list(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); inp.blur(); } });
    m.append(h('div', { class: 'searchbox' }, ico('search'), inp));
    m.append(h('div', { class: 'bar scroll', role: 'group', 'aria-label': 'Главы плана счетов' },
      [['Все', -1], ...CHAPTERS.map((c, i) => [c.short, i])].map(([l, i]) => h('button', { type: 'button', class: 'chip', 'aria-pressed': String(this.chap === i), onclick: () => { this.chap = i; this.render(); } }, l))));
    m.append(h('div', { class: 'legend', 'aria-label': 'Обозначения типов счетов' }, TYPE_ORDER.map(t => h('span', null, typeBadge(t), TYPES[t].ru.toLowerCase()))));
    m.append(h('p', { class: 'rcount', id: 'ref-count' }));
    m.append(h('div', { id: 'ref-list' }));
    this.list();
  },
  list() {
    const box = $('#ref-list'); if (!box) return; box.replaceChildren();
    const q = norm(this.q);
    const match = a => !q || a.code.startsWith(q) || norm(a.ru).includes(q) || norm(a.uz).includes(q);
    let shown = 0;
    CHAPTERS.forEach((ch, ci) => {
      if (this.chap !== -1 && this.chap !== ci) return;
      const chunk = [];
      for (const sid of ch.secs) {
        const accs = ACC.filter(a => a.sec === sid && match(a)); if (!accs.length) continue;
        shown += accs.length;
        const rows = h('div', { class: 'rows' });
        for (const a of accs) {
          const open = this.open === a.code;
          rows.append(h('button', { type: 'button', class: 'row' + (a.isGroup ? ' grp' : ''), 'aria-expanded': String(open), onclick: () => { this.open = open ? null : a.code; this.list(); } },
            h('span', { class: 'cc' }, a.code), h('span', { class: 'nm' }, nm(a), h('small', null, nm2(a))), typeBadge(a.t)));
          if (open) rows.append(this.details(a));
        }
        if (ch.secs.length > 1) chunk.push(h('div', { class: 'secname' }, SEC_BY[sid][P.lang === 'uz' ? 'uz' : 'ru']));
        chunk.push(rows);
      }
      if (chunk.length) { box.append(h('h2', { class: 'chap' }, ch[P.lang === 'uz' ? 'uz' : 'ru'])); box.append(...chunk); }
    });
    if (!shown) box.append(h('p', { class: 'empty' }, 'Ничего не найдено. Попробуйте код (например, 5110) или другое слово' + (this.chap !== -1 ? ', либо выберите «Все»' : '') + '.'));
    const c = $('#ref-count'); if (c) c.textContent = q || this.chap !== -1 ? `Найдено: ${nAcc(shown)}. Нажмите на счёт, чтобы увидеть его проводки.` : `${nAcc(ACC.length)}. Нажмите на счёт, чтобы увидеть его проводки.`;
  },
  details(a) {
    const codes = a.isGroup ? SUBS.filter(x => x.grp === a.code).map(x => x.code) : [a.code];
    const asD = ENT.filter(e => e.dc.some(c => codes.includes(c)));
    const asK = ENT.filter(e => e.kc.some(c => codes.includes(c)));
    const t = TYPES[a.t];
    const det = h('div', { class: 'det' },
      h('div', { class: 'acard' }, h('span', { class: 'meta', style: 'margin-top:0' }, typeBadge(a.t), h('span', null, t.ru + ': ' + t.hint)),
        h('span', { class: 'meta' }, groupLine(a) + ' · ' + secName(a))));
    const g = a.isGroup ? a.code : a.grp;
    if (g) det.append(h('div', { class: 'learn' }, h('span', null, `Учить группу ${g}:`),
      h('button', { type: 'button', class: 'btn sm', onclick: () => learnGroup(g, 'cards') }, 'Карточки'),
      h('button', { type: 'button', class: 'btn sm', onclick: () => learnGroup(g, 'test') }, 'Тест')));
    const lst = (arr, key) => {
      const lim = this.all[key] ? arr.length : 6;
      const out = [h('ul', { class: 'elist' }, arr.slice(0, lim).map(e => h('li', null,
        h('span', { class: 'pp' }, h('span', { class: 'd' }, 'Дт ' + e.dt), ' ', h('span', { class: 'k' }, 'Кт ' + e.kt)), h('span', null, et(e)))))];
      if (arr.length > lim) out.push(h('button', { type: 'button', class: 'linkbtn', onclick: () => { this.all[key] = true; this.list(); } }, `Показать все (${arr.length})`));
      return out;
    };
    if (asD.length) det.append(h('h4', null, `Счёт по дебету — ${nEnt(asD.length)}`), ...lst(asD, a.code + 'd'));
    if (asK.length) det.append(h('h4', null, `Счёт по кредиту — ${nEnt(asK.length)}`), ...lst(asK, a.code + 'k'));
    if (!asD.length && !asK.length) det.append(h('p', { class: 'note' }, a.sec === 'off' ? 'Забалансовые счета ведутся простой записью, без корреспонденции.' : 'В таблицах Инструкции проводок с этим счётом нет.'));
    return det;
  }
};

/* the on-screen keyboard shrinks the window in the Android app: hide the tab bar while it is open */
let lastW = innerWidth, maxH = innerHeight;
function kbCheck() {
  if (innerWidth !== lastW) { lastW = innerWidth; maxH = innerHeight; }

  document.body.classList.toggle('kb', innerHeight < maxH * 0.75);
}
window.addEventListener('resize', kbCheck);

/* Android shell (APK): system back button and system bar colours; no effect in a browser */
window.handleBack = () => {
  if (Sheet.close()) return true;
  if (VIEW === RefView && RefView.open) { RefView.open = null; RefView.list(); return true; }
  if (VIEW === CaseView && CaseView.back()) return true;
  if (VIEW && VIEW !== HomeView) { go('home'); return true; }
  return false;
};
function syncBars() {
  try {
    if (!window.Android || !window.Android.setBars) return;
    const bg = getComputedStyle(document.body).backgroundColor;
    const nav = $('#bnav'); const navBg = nav && getComputedStyle(nav).display !== 'none' ? getComputedStyle(nav).backgroundColor : bg;
    window.Android.setBars(bg, navBg, matchMedia('(prefers-color-scheme: dark)').matches);
  } catch (e) {}
}
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncBars); } catch (e) {}
try { matchMedia('(max-width: 720px)').addEventListener('change', syncBars); } catch (e) {}

buildNav();
async function init() {
  let d = window.__NSBU_DATA;
  for (let attempt = 0; !d && attempt < 3; attempt++) {
    try { const res = await fetch('data.json', { cache: attempt ? 'reload' : 'default' }); if (!res.ok) throw new Error(res.status); d = await res.json(); }
    catch (err) { await new Promise(r => setTimeout(r, 800 * (attempt + 1))); }
  }
  if (!d) {
    $('#main').replaceChildren(h('p', { class: 'empty' }, 'Не удалось загрузить план счетов. Проверьте интернет и попробуйте ещё раз.'),
      h('button', { type: 'button', class: 'btn pri', onclick: () => { $('#main').replaceChildren(h('p', { class: 'loading' }, 'Загружаю план счетов…')); init(); } }, 'Повторить загрузку'));
    return;
  }
  prep(d);
  const tr = restoreRound('test', c => BY[c]); if (tr) { TestView.r = tr; TestView.pick(); }
  const er = restoreRound('entries', id => ENT_BY[id]); if (er) { EntView.r = er; EntView.pick(); }
  setLang(P.lang, true);
  footer();
  route();
  syncBars();
}
init();
})();
</script>
