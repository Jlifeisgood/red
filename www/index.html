<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Башня</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="scene" class="z0">
    <svg id="sv" viewBox="0 24 360 400" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg"></svg>
    <canvas id="gl"></canvas>
    <svg id="ov" viewBox="0 24 360 400" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="hud">
      <div id="hud-l">
        <div class="bar hp"><i class="ico"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.800-8 11-8 11z"/></svg></i><div class="track"><div class="fill hp" id="b-hp"></div><span id="t-hp"></span></div></div>
        <div class="bar en"><i class="ico"><svg viewBox="0 0 24 24"><path d="M7 3h2v8a1 1 0 0 0 2 0V3h2v8a1 1 0 0 0 2 0V3h2v9a4 4 0 0 1-3 3.900V21h-2v-5.100A4 4 0 0 1 7 12z"/></svg></i><div class="track"><div class="fill en" id="b-en"></div><span id="t-en"></span></div></div>
        <div class="bar xp"><i class="ico lv" id="lvl"></i><div class="track"><div class="fill xp" id="b-xp"></div><span id="t-xp"></span></div></div>
      </div>
      <div id="hud-r">
        <div id="sign" class="glass"><div id="floor"></div><div id="zone"></div><div id="quest"></div></div>
        <div id="hud-btns">
          <button id="btn-hl" title="Подсветить предметы">👁</button><button id="btn-fast" title="Быстрая ходьба">⏩</button><button id="mute" title="Звук">🔊</button><button id="btn-set" title="Настройки">⚙</button>
        </div>
      </div>
    </div>
    <div id="toast"></div>
    <div id="inv"></div>
  </div>
  <div id="log"></div>
  <div id="dock"></div>
</div>
<div id="sheet"><div id="sheet-title"></div><div id="sheet-body"><div id="actions"></div></div></div>
<script src="art.js"></script>
<script src="scene.js"></script>
<script src="game.js"></script>
<script src="chars3d.bundle.js"></script>
</body>
</html>
