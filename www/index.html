<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Башня</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div class="panel" id="hud">
    <div id="top"><span id="floor"></span><span id="zone"></span><button id="mute" title="Звук и вибрация">🔊</button></div>
    <div class="bars">
      <div class="bar"><span>Здоровье</span><div class="track"><div class="fill" id="b-hp" style="background:var(--hp)"></div></div><span id="t-hp"></span></div>
      <div class="bar"><span>Энергия</span><div class="track"><div class="fill" id="b-en" style="background:var(--en)"></div></div><span id="t-en"></span></div>
      <div class="bar"><span id="lvl"></span><div class="track"><div class="fill" id="b-xp" style="background:var(--accent)"></div></div><span id="t-xp"></span></div>
    </div>
    <div id="inv"></div>
  </div>
  <div id="scene" class="panel z0">
    <div id="sc-bg"></div><div id="sc-lamp"></div><div id="sc-sign"></div>
    <div id="sc-doors"></div>
    <div id="sc-lift" class="lift"><span class="lf-x">✖</span></div>
    <div id="sc-center"></div>
    <div id="sc-hero"></div>
    <div id="sc-enemy"><div id="en-name"></div><div class="track ehpbar"><div class="fill" id="ehp"></div></div><div id="en-tr"></div><div id="en-ic">👾</div><div id="zones"></div></div>
    <div id="sc-floor"></div>
  </div>
  <div id="log" class="panel"></div>
  <div id="actions"></div>
</div>
<script src="game.js"></script>
</body>
</html>
