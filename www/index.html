<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Башня</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="scene" class="z0">
    <svg id="sv" viewBox="0 24 360 400" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="hud">
      <div id="hud-l" class="glass">
        <div class="bar"><b>❤️</b><div class="track"><div class="fill hp" id="b-hp"></div></div><span id="t-hp"></span></div>
        <div class="bar"><b>🍖</b><div class="track"><div class="fill en" id="b-en"></div></div><span id="t-en"></span></div>
        <div class="bar"><b id="lvl"></b><div class="track"><div class="fill xp" id="b-xp"></div></div><span id="t-xp"></span></div>
      </div>
      <div id="hud-r">
        <div id="sign" class="glass"><div id="floor"></div><div id="zone"></div><div id="quest"></div></div>
        <div id="hud-btns">
          <button id="btn-hl" title="Подсветить предметы">👁</button><button id="btn-fast" title="Быстрая ходьба">⏩</button><button id="mute" title="Звук">🔊</button><button id="btn-set" title="Настройки">⚙</button>
        </div>
      </div>
    </div>
    <div id="toast"></div>
    <div id="inv"></div>
  </div>
  <div id="log"></div>
  <div id="dock"></div>
</div>
<div id="sheet"><div id="sheet-title"></div><div id="sheet-body"><div id="actions"></div></div></div>
<script src="art.js"></script>
<script src="scene.js"></script>
<script src="game.js"></script>
</body>
</html>
