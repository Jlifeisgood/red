name: Build Android APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # публикация APK в релиз с постоянной ссылкой
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android

      # Постоянный ключ берётся из секретов репозитория:
      #   ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      # Если секретов нет, создаётся временный ключ: APK подписан и устанавливается,
      # но обновить поверх него сборку с другим ключом нельзя.
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            PASS="$KS_PASS"; ALIAS="$KS_ALIAS"; KEYPASS="${KS_KEYPASS:-$KS_PASS}"
            echo "Using the permanent key from repository secrets."
          else
            PASS="$(openssl rand -hex 16)"; ALIAS="tower"; KEYPASS="$PASS"
            keytool -genkeypair -v -keystore "$KS" -storetype PKCS12 -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Tower Game, O=Tower, C=US"
            echo "::warning::No signing secrets found: signed with a TEMPORARY key. Add ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD secrets for a permanent key."
          fi
          echo "::add-mask::$PASS"; echo "::add-mask::$KEYPASS"
          {
            echo "KEYSTORE_FILE=$KS"; echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=$ALIAS";  echo "KEY_PASSWORD=$KEYPASS"
          } >> "$GITHUB_ENV"

      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Verify signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tower-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # Постоянная ссылка на свежий APK: релиз с тегом «apk» пересоздаётся при каждой сборке ветки tower-game.
      # Скачать: https://github.com/<owner>/<repo>/releases/download/apk/tower.apk
      - name: Publish APK to the «apk» release
        if: github.ref == 'refs/heads/tower-game'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk tower.apk
          if [ -n "$KS_B64" ]; then
            KEYNOTE="Подписано постоянным ключом: новые версии ставятся поверх старых, прогресс сохраняется."
          else
            KEYNOTE="Внимание: пока подписано временным ключом. Если «Башня» уже стоит, удалите её перед установкой (сначала сделайте «Экспорт сохранения» в настройках, после установки — «Импорт»)."
          fi
          cat > notes.md <<NOTES
          Свежая сборка игры «Башня» для Android (коммит ${GITHUB_SHA::7}, $(date -u +'%Y-%m-%d %H:%M') UTC).

          **Как установить:** скачайте **tower.apk** ниже, откройте файл на телефоне и разрешите установку из этого источника.

          $KEYNOTE
          NOTES
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk tower.apk --target "$GITHUB_SHA" --title "Башня — свежая сборка" --notes-file notes.md --latest
